<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-label="FitFindr session state" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4B54A8" stroke-width="1.6"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8A8A82" stroke-width="1.6"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="400" rx="14" fill="#FFFFFF" stroke="#E3E3DE"/>
  <text x="40" y="44" font-size="20" font-weight="600" fill="#1A1A18">Session fields, in the order run_agent writes them</text>
  <text x="40" y="68" font-size="13" fill="#6B6B64">Each tool reads its input back out of the session. Criterion 3 compares the two ids marked below.</text>
  <rect x="40" y="100" width="168" height="80" rx="9" fill="#EEF0FB" stroke="#4B54A8"/>
  <text x="124.0" y="129" text-anchor="middle" font-size="14" font-weight="600" fill="#2A2F6B" font-family="SFMono-Regular, Menlo, Consolas, monospace">parsed</text>
  <text x="124.0" y="149" text-anchor="middle" font-size="12" fill="#4A4A45">description, size,</text>
  <text x="124.0" y="165" text-anchor="middle" font-size="12" fill="#4A4A45">max_price</text>
  <rect x="223" y="100" width="168" height="80" rx="9" fill="#EEF0FB" stroke="#4B54A8"/>
  <text x="307.0" y="129" text-anchor="middle" font-size="14" font-weight="600" fill="#2A2F6B" font-family="SFMono-Regular, Menlo, Consolas, monospace">search_results</text>
  <text x="307.0" y="149" text-anchor="middle" font-size="12" fill="#4A4A45">search_listings</text>
  <text x="307.0" y="165" text-anchor="middle" font-size="12" fill="#4A4A45">output</text>
  <path d="M209 140 H221" fill="none" stroke="#4B54A8" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="406" y="100" width="168" height="80" rx="9" fill="#EEF0FB" stroke="#4B54A8"/>
  <text x="490.0" y="129" text-anchor="middle" font-size="14" font-weight="600" fill="#2A2F6B" font-family="SFMono-Regular, Menlo, Consolas, monospace">selected_item</text>
  <text x="490.0" y="149" text-anchor="middle" font-size="12" fill="#4A4A45">first result, or the</text>
  <text x="490.0" y="165" text-anchor="middle" font-size="12" fill="#4A4A45">branch 2 pick  (id A)</text>
  <path d="M392 140 H404" fill="none" stroke="#4B54A8" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="589" y="100" width="168" height="80" rx="9" fill="#EEF0FB" stroke="#4B54A8"/>
  <text x="673.0" y="129" text-anchor="middle" font-size="14" font-weight="600" fill="#2A2F6B" font-family="SFMono-Regular, Menlo, Consolas, monospace">price_check</text>
  <text x="673.0" y="149" text-anchor="middle" font-size="12" fill="#4A4A45">compare_price</text>
  <text x="673.0" y="165" text-anchor="middle" font-size="12" fill="#4A4A45">output</text>
  <path d="M575 140 H587" fill="none" stroke="#4B54A8" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="772" y="100" width="168" height="80" rx="9" fill="#EEF0FB" stroke="#4B54A8"/>
  <text x="856.0" y="129" text-anchor="middle" font-size="14" font-weight="600" fill="#2A2F6B" font-family="SFMono-Regular, Menlo, Consolas, monospace">outfit_input_item</text>
  <text x="856.0" y="149" text-anchor="middle" font-size="12" fill="#4A4A45">copied from</text>
  <text x="856.0" y="165" text-anchor="middle" font-size="12" fill="#4A4A45">selected_item  (id B)</text>
  <path d="M758 140 H770" fill="none" stroke="#4B54A8" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="40" y="228" width="168" height="80" rx="9" fill="#EEF0FB" stroke="#4B54A8"/>
  <text x="124.0" y="257" text-anchor="middle" font-size="14" font-weight="600" fill="#2A2F6B" font-family="SFMono-Regular, Menlo, Consolas, monospace">outfit_suggestion</text>
  <text x="124.0" y="277" text-anchor="middle" font-size="12" fill="#4A4A45">suggest_outfit</text>
  <text x="124.0" y="293" text-anchor="middle" font-size="12" fill="#4A4A45">output</text>
  <rect x="223" y="228" width="168" height="80" rx="9" fill="#EEF0FB" stroke="#4B54A8"/>
  <text x="307.0" y="257" text-anchor="middle" font-size="14" font-weight="600" fill="#2A2F6B" font-family="SFMono-Regular, Menlo, Consolas, monospace">fit_card</text>
  <text x="307.0" y="277" text-anchor="middle" font-size="12" fill="#4A4A45">create_fit_card</text>
  <text x="307.0" y="293" text-anchor="middle" font-size="12" fill="#4A4A45">output</text>
  <path d="M209 268 H221" fill="none" stroke="#4B54A8" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="406" y="228" width="168" height="80" rx="9" fill="#F4F4F1" stroke="#8A8A82"/>
  <text x="490.0" y="257" text-anchor="middle" font-size="14" font-weight="600" fill="#1A1A18" font-family="SFMono-Regular, Menlo, Consolas, monospace">remembered_item</text>
  <text x="490.0" y="277" text-anchor="middle" font-size="12" fill="#4A4A45">set only with</text>
  <text x="490.0" y="293" text-anchor="middle" font-size="12" fill="#4A4A45">--remember</text>
  <path d="M392 268 H404" fill="none" stroke="#8A8A82" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#g)"/>
  <path d="M856.0 182 V204 H124.0 V226" fill="none" stroke="#4B54A8" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="589" y="228" width="351" height="80" rx="9" fill="#F4F4F1" stroke="#8A8A82"/>
  <text x="764.5" y="257" text-anchor="middle" font-size="14" font-weight="600" fill="#1A1A18">Set only on a branch</text>
  <text x="764.5" y="277" text-anchor="middle" font-size="12" fill="#4A4A45">error: search was empty, run stops</text>
  <text x="764.5" y="293" text-anchor="middle" font-size="12" fill="#4A4A45">original_pick, price_branch: branch 2 ran</text>
  <text x="40" y="352" text-anchor="start" font-size="12" fill="#4A4A45">Criterion 3 passes when id A equals id B for a matching query.</text>
</svg>
