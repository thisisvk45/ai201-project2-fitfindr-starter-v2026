<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-label="FitFindr decisions in unit 4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4B54A8" stroke-width="1.6"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8A8A82" stroke-width="1.6"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="470" rx="14" fill="#FFFFFF" stroke="#E3E3DE"/>
  <text x="30" y="42" font-size="20" font-weight="600" fill="#1A1A18">How the agent decides each step</text>
  <text x="30" y="66" font-size="13" fill="#6B6B64">agent.py::run_agent. Blue is the normal path. Gray dashed paths are the decisions, each with the condition that takes it.</text>
  <rect x="30" y="100" width="140" height="70" rx="9" fill="#EEF0FB" stroke="#4B54A8"/>
  <text x="100.0" y="126" text-anchor="middle" font-size="13" font-weight="600" fill="#2A2F6B" font-family="SFMono-Regular, Menlo, Consolas, monospace">parse_query</text>
  <text x="100.0" y="145" text-anchor="middle" font-size="11.5" fill="#4A4A45">regex: description,</text>
  <text x="100.0" y="160" text-anchor="middle" font-size="11.5" fill="#4A4A45">size, max_price</text>
  <rect x="194" y="100" width="140" height="70" rx="9" fill="#EEF0FB" stroke="#4B54A8"/>
  <text x="264.0" y="126" text-anchor="middle" font-size="13" font-weight="600" fill="#2A2F6B" font-family="SFMono-Regular, Menlo, Consolas, monospace">search_listings</text>
  <text x="264.0" y="145" text-anchor="middle" font-size="11.5" fill="#4A4A45">keyword search with</text>
  <text x="264.0" y="160" text-anchor="middle" font-size="11.5" fill="#4A4A45">size and price filters</text>
  <rect x="290" y="91" width="40" height="17" rx="8" fill="#4B54A8"/>
  <text x="310" y="103" text-anchor="middle" font-size="10.5" font-weight="600" fill="#FFFFFF">MCP</text>
  <rect x="358" y="100" width="140" height="70" rx="9" fill="#EEF0FB" stroke="#4B54A8"/>
  <text x="428.0" y="126" text-anchor="middle" font-size="13" font-weight="600" fill="#2A2F6B" font-family="SFMono-Regular, Menlo, Consolas, monospace">compare_price</text>
  <text x="428.0" y="145" text-anchor="middle" font-size="11.5" fill="#4A4A45">pick vs median of</text>
  <text x="428.0" y="160" text-anchor="middle" font-size="11.5" fill="#4A4A45">its category</text>
  <rect x="454" y="91" width="40" height="17" rx="8" fill="#4B54A8"/>
  <text x="474" y="103" text-anchor="middle" font-size="10.5" font-weight="600" fill="#FFFFFF">MCP</text>
  <rect x="522" y="100" width="140" height="70" rx="9" fill="#EEF0FB" stroke="#4B54A8"/>
  <text x="592.0" y="126" text-anchor="middle" font-size="13" font-weight="600" fill="#2A2F6B" font-family="SFMono-Regular, Menlo, Consolas, monospace">suggest_outfit</text>
  <text x="592.0" y="145" text-anchor="middle" font-size="11.5" fill="#4A4A45">pick plus wardrobe,</text>
  <text x="592.0" y="160" text-anchor="middle" font-size="11.5" fill="#4A4A45">plain text</text>
  <rect x="686" y="100" width="140" height="70" rx="9" fill="#EEF0FB" stroke="#4B54A8"/>
  <text x="756.0" y="126" text-anchor="middle" font-size="13" font-weight="600" fill="#2A2F6B" font-family="SFMono-Regular, Menlo, Consolas, monospace">create_fit_card</text>
  <text x="756.0" y="145" text-anchor="middle" font-size="11.5" fill="#4A4A45">2 to 4 sentences,</text>
  <text x="756.0" y="160" text-anchor="middle" font-size="11.5" fill="#4A4A45">price as $45</text>
  <rect x="850" y="100" width="140" height="70" rx="9" fill="#EEF0FB" stroke="#4B54A8"/>
  <text x="920.0" y="126" text-anchor="middle" font-size="13" font-weight="600" fill="#2A2F6B">Done</text>
  <text x="920.0" y="145" text-anchor="middle" font-size="11.5" fill="#4A4A45">outfit and fit card</text>
  <text x="920.0" y="160" text-anchor="middle" font-size="11.5" fill="#4A4A45">shown to the user</text>
  <path d="M172 135.0 H192" fill="none" stroke="#4B54A8" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M336 135.0 H356" fill="none" stroke="#4B54A8" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M500 135.0 H520" fill="none" stroke="#4B54A8" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M664 135.0 H684" fill="none" stroke="#4B54A8" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M828 135.0 H848" fill="none" stroke="#4B54A8" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M264.0 172 V233" fill="none" stroke="#8A8A82" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#g)"/>
  <text x="270.0" y="197" text-anchor="start" font-size="11.5" fill="#4A4A45">empty, size given</text>
  <rect x="194" y="235" width="140" height="66" rx="9" fill="#F4F4F1" stroke="#8A8A82"/>
  <text x="264.0" y="261" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A18">Retry once</text>
  <text x="264.0" y="280" text-anchor="middle" font-size="11.5" fill="#4A4A45">without the size</text>
  <text x="264.0" y="295" text-anchor="middle" font-size="11.5" fill="#4A4A45">(stretch)</text>
  <path d="M264.0 303 V351" fill="none" stroke="#8A8A82" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#g)"/>
  <text x="270.0" y="325" text-anchor="start" font-size="11.5" fill="#4A4A45">still empty,</text>
  <text x="270.0" y="339" text-anchor="start" font-size="11.5" fill="#4A4A45">or no size given</text>
  <rect x="194" y="353" width="140" height="66" rx="9" fill="#F4F4F1" stroke="#8A8A82"/>
  <text x="264.0" y="379" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A18">Stop</text>
  <text x="264.0" y="398" text-anchor="middle" font-size="11.5" fill="#4A4A45">error names what</text>
  <text x="264.0" y="413" text-anchor="middle" font-size="11.5" fill="#4A4A45">to change</text>
  <path d="M336 249 H368 V174" fill="none" stroke="#8A8A82" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#g)"/>
  <text x="340" y="265" text-anchor="start" font-size="11.5" fill="#4A4A45">found</text>
  <path d="M448.0 172 V233" fill="none" stroke="#8A8A82" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#g)"/>
  <text x="454.0" y="190" text-anchor="start" font-size="11.5" fill="#4A4A45">above typical,</text>
  <text x="454.0" y="204" text-anchor="start" font-size="11.5" fill="#4A4A45">no price limit</text>
  <rect x="382" y="235" width="140" height="66" rx="9" fill="#F4F4F1" stroke="#8A8A82"/>
  <text x="452.0" y="261" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A18">Search again</text>
  <text x="452.0" y="280" text-anchor="middle" font-size="11.5" fill="#4A4A45">under the median,</text>
  <text x="452.0" y="295" text-anchor="middle" font-size="11.5" fill="#4A4A45">same category</text>
  <path d="M524 268 H592.0 V174" fill="none" stroke="#8A8A82" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#g)"/>
  <text x="598.0" y="229" text-anchor="start" font-size="11.5" fill="#4A4A45">cheaper pick</text>
  <text x="598.0" y="243" text-anchor="start" font-size="11.5" fill="#4A4A45">or keep first</text>
  <rect x="686" y="353" width="304" height="66" rx="9" fill="#F4F4F1" stroke="#8A8A82"/>
  <text x="838.0" y="379" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A18">Stop with the item found</text>
  <text x="838.0" y="398" text-anchor="middle" font-size="11.5" fill="#4A4A45">model unreachable: message says</text>
  <text x="838.0" y="413" text-anchor="middle" font-size="11.5" fill="#4A4A45">check the key, then try again</text>
  <path d="M756.0 172 V351" fill="none" stroke="#8A8A82" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#g)"/>
  <path d="M642 172 V385 H684" fill="none" stroke="#8A8A82" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#g)"/>
  <text x="762.0" y="300" text-anchor="start" font-size="11.5" fill="#4A4A45">ModelUnavailable</text>
  <text x="30" y="448" font-size="12" fill="#6B6B64">The retry, the second MCP tool and the plain text outfit are my unit 4 stretch work. The empty search stop is the required branch.</text>
</svg>
