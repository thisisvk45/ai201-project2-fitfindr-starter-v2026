<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-label="FitFindr agent flow" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4B54A8" stroke-width="1.6"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8A8A82" stroke-width="1.6"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="430" rx="14" fill="#FFFFFF" stroke="#E3E3DE"/>
  <text x="40" y="44" font-size="20" font-weight="600" fill="#1A1A18">FitFindr: how one query moves through the loop</text>
  <text x="40" y="68" font-size="13" fill="#6B6B64">agent.py::run_agent. Blue is the main path. Gray dashed paths are the two branches and style memory.</text>
  <rect x="40" y="104" width="160" height="76" rx="9" fill="#EEF0FB" stroke="#4B54A8"/>
  <text x="120.0" y="133" text-anchor="middle" font-size="14" font-weight="600" fill="#2A2F6B">Parse query</text>
  <text x="120.0" y="153" text-anchor="middle" font-size="12" fill="#4A4A45">regex: description,</text>
  <text x="120.0" y="169" text-anchor="middle" font-size="12" fill="#4A4A45">size, max_price</text>
  <rect x="230" y="104" width="160" height="76" rx="9" fill="#EEF0FB" stroke="#4B54A8"/>
  <text x="310.0" y="133" text-anchor="middle" font-size="14" font-weight="600" fill="#2A2F6B" font-family="SFMono-Regular, Menlo, Consolas, monospace">search_listings</text>
  <text x="310.0" y="153" text-anchor="middle" font-size="12" fill="#4A4A45">keyword match with</text>
  <text x="310.0" y="169" text-anchor="middle" font-size="12" fill="#4A4A45">size and price filters</text>
  <rect x="420" y="104" width="160" height="76" rx="9" fill="#EEF0FB" stroke="#4B54A8"/>
  <text x="500.0" y="133" text-anchor="middle" font-size="14" font-weight="600" fill="#2A2F6B" font-family="SFMono-Regular, Menlo, Consolas, monospace">compare_price</text>
  <text x="500.0" y="153" text-anchor="middle" font-size="12" fill="#4A4A45">pick vs median of</text>
  <text x="500.0" y="169" text-anchor="middle" font-size="12" fill="#4A4A45">its category</text>
  <rect x="610" y="104" width="160" height="76" rx="9" fill="#EEF0FB" stroke="#4B54A8"/>
  <text x="690.0" y="133" text-anchor="middle" font-size="14" font-weight="600" fill="#2A2F6B" font-family="SFMono-Regular, Menlo, Consolas, monospace">suggest_outfit</text>
  <text x="690.0" y="153" text-anchor="middle" font-size="12" fill="#4A4A45">pick plus wardrobe</text>
  <text x="690.0" y="169" text-anchor="middle" font-size="12" fill="#4A4A45">(model call)</text>
  <rect x="800" y="104" width="160" height="76" rx="9" fill="#EEF0FB" stroke="#4B54A8"/>
  <text x="880.0" y="133" text-anchor="middle" font-size="14" font-weight="600" fill="#2A2F6B" font-family="SFMono-Regular, Menlo, Consolas, monospace">create_fit_card</text>
  <text x="880.0" y="153" text-anchor="middle" font-size="12" fill="#4A4A45">outfit plus pick</text>
  <text x="880.0" y="169" text-anchor="middle" font-size="12" fill="#4A4A45">(model call)</text>
  <path d="M202 142.0 H228" fill="none" stroke="#4B54A8" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M392 142.0 H418" fill="none" stroke="#4B54A8" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M582 142.0 H608" fill="none" stroke="#4B54A8" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M772 142.0 H798" fill="none" stroke="#4B54A8" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M310.0 182 V268" fill="none" stroke="#8A8A82" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#g)"/>
  <text x="318.0" y="228" text-anchor="start" font-size="12" fill="#4A4A45">empty list</text>
  <rect x="230" y="270" width="160" height="76" rx="9" fill="#F4F4F1" stroke="#8A8A82"/>
  <text x="310.0" y="299" text-anchor="middle" font-size="14" font-weight="600" fill="#1A1A18">Stop</text>
  <text x="310.0" y="319" text-anchor="middle" font-size="12" fill="#4A4A45">session['error'] names</text>
  <text x="310.0" y="335" text-anchor="middle" font-size="12" fill="#4A4A45">what to change</text>
  <path d="M500.0 182 V268" fill="none" stroke="#8A8A82" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#g)"/>
  <text x="508.0" y="214" text-anchor="start" font-size="12" fill="#4A4A45">above typical and</text>
  <text x="508.0" y="229" text-anchor="start" font-size="12" fill="#4A4A45">no price limit</text>
  <rect x="420" y="270" width="160" height="76" rx="9" fill="#F4F4F1" stroke="#8A8A82"/>
  <text x="500.0" y="299" text-anchor="middle" font-size="14" font-weight="600" fill="#1A1A18">Search again</text>
  <text x="500.0" y="319" text-anchor="middle" font-size="12" fill="#4A4A45">limit = category median,</text>
  <text x="500.0" y="335" text-anchor="middle" font-size="12" fill="#4A4A45">same category only</text>
  <path d="M582 308 H690.0 V184" fill="none" stroke="#8A8A82" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#g)"/>
  <text x="698.0" y="258" text-anchor="start" font-size="12" fill="#4A4A45">cheaper pick,</text>
  <text x="698.0" y="273" text-anchor="start" font-size="12" fill="#4A4A45">or keep the first</text>
  <path d="M880.0 182 V268" fill="none" stroke="#8A8A82" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#g)"/>
  <text x="888.0" y="228" text-anchor="start" font-size="12" fill="#4A4A45">--remember</text>
  <rect x="800" y="270" width="160" height="76" rx="9" fill="#F4F4F1" stroke="#8A8A82"/>
  <text x="880.0" y="299" text-anchor="middle" font-size="14" font-weight="600" fill="#1A1A18">Style memory</text>
  <text x="880.0" y="319" text-anchor="middle" font-size="12" fill="#4A4A45">saves the pick; added to</text>
  <text x="880.0" y="335" text-anchor="middle" font-size="12" fill="#4A4A45">the wardrobe next run</text>
  <text x="40" y="392" text-anchor="start" font-size="12" fill="#4A4A45">Branch 1 is required. Branch 2, compare_price and style memory are the three stretch features.</text>
</svg>
